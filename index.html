<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaibhav's Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            color: rgb(255, 254, 254);
            font-family: "Poppins", "sans-serif";
        }

        body {
            background-color: rgb(16, 16, 37);
            color: white;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-around;
            height: 90px;
            background-color: rgb(69, 32, 112);
        }

        nav ul {
            display: flex;
            justify-content: center;
        }

        nav ul li {
            list-style-type: none;
            margin: 0 23px;
        }

        nav ul li a {
            text-decoration: none;
            color: rgb(118, 135, 233);

        }

        nav ul li a:hover {
            color: blueviolet;
            font-size: 1.10rem;

        }

        main hr {
            border: 0cap;
            background-color: darkseagreen;
            height: 1px;
            margin: 40px 80px;

        }

        .left {
            font-size: 1rem;
        }

        .firstSection {
            display: flex;
            justify-content: space-around;
            margin: 80px 0;
            height: 55vh;
        }

        .firstSection>div {
            width: 30%;

        }

        .leftSection {
            font-size: 2rem;
            align-items: center;
        }

        .rightSection img {
            width: 120%;
        }

        .text-purple {
            color: blueviolet;
        }

        .text-gray {
            color: rgb(151, 148, 148);
            font-size: 15px;
        }

        .domain {
            color: blueviolet;
        }

        #element {
            color: rgb(76, 226, 201);
        }

        .secondSection {
            max-width: 80vw;
            font-size: xx-small;
            margin: auto;
            height: 100vh;
        }

        .secondSection h1 {
            font-size: 1.5rem;
        }

        .secondSection .box {
            background: rgb(248, 245, 245);
            width: 80vw;
            height: 2px;
            margin: 55px 0;
            display: flex;
        }

        .secondSection .vertical {
            height: 93px;
            width: 1px;
            background-color: white;
            margin: 0 100px;

        }

        .image-top {
            width: 600px;
            position: relative;
            left: 800px;
            top: 40px;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <dev class="left">Vaibhav's Portfolio</dev>
            <dev class="right"></dev>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">about</a></li>
                <li><a href="/">Services</a></li>
                <li><a href="/">Projects</a></li>
                <li><a href="/">Contact Me</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="firstSection">
            <div class="leftSection">
                Hi, My Name is <span class="text-purple">Vaibhav</span>

                <div>
                    & I am a Passionate <span class="domain">Python Fullstack Developer</span>
                </div>
                <span id="element"></span>
            </div>

            <div class="rightSection">
                <img src="bg.png" alt="">
            </div>
        </section>

        <hr style="
     border: 0cap;
     background-color: darkseagreen;
     height: 1px;
     margin: 50px 84px;
     padding-top: 1px;

    ">

        <section class="secondSection">
            <span class="text-gray">What I Have Done So Far In My Academics ?</span>
            <h1>Relevant Course Experience !!!</h1>
            <div class="box">
                <div class="vertical">
                    <img class="image-top" src="rc.png" alt="">
                </div>
                <div class="vertical"></div>
                <div class="vertical"></div>
                <div class="vertical"></div>
            </div>

        </section>


    </main>
    <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"></script>
    <!-- Setup and start animation! -->
    <script>
        var typed = new Typed('#element', {
            strings: ['and Aspiring Data Science/Aiml Tech Professional'],
            typeSpeed: 50,
        });
    </script>
</body>

</html>
